<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工具门户 · Dev Arsenal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0: #06090f;
      --bg1: #0b1220;
      --panel: rgba(12, 22, 38, 0.72);
      --panel-solid: #0e1828;
      --line: rgba(0, 229, 255, 0.18);
      --line-strong: rgba(0, 229, 255, 0.45);
      --cyan: #00e5ff;
      --cyan-dim: #00b8d4;
      --amber: #ffb020;
      --mint: #3dff9a;
      --text: #e8f1ff;
      --muted: #8aa0b8;
      --danger: #ff5c7a;
      --radius: 18px;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--bg0);
      color: var(--text);
      font-family: "Rajdhani", system-ui, sans-serif;
      overflow-x: clip;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 50% at 15% -10%, rgba(0, 229, 255, 0.16), transparent 55%),
        radial-gradient(ellipse 60% 40% at 90% 10%, rgba(255, 176, 32, 0.1), transparent 50%),
        radial-gradient(ellipse 50% 50% at 50% 100%, rgba(61, 255, 154, 0.06), transparent 55%);
      z-index: 0;
    }

    #grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      opacity: 0.35;
      background-image:
        linear-gradient(rgba(0, 229, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 229, 255, 0.05) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(ellipse at center, black 20%, transparent 75%);
    }

    #particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .scanline {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.08) 2px,
        rgba(0, 0, 0, 0.08) 4px
      );
      opacity: 0.35;
      mix-blend-mode: multiply;
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: min(1980px, calc(100% - 24px));
      margin: 0 auto;
      padding: 36px 0 80px;
    }

    .layout {
      display: grid;
      grid-template-columns: 168px minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }

    .toc {
      position: sticky;
      top: 96px;
      z-index: 50;
      align-self: start;
      padding: 16px 14px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(12, 22, 38, 0.92);
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
      overflow: visible;
      display: flex;
      flex-direction: column;
      animation: rise 0.8s 0.05s ease both;
      will-change: transform;
      transition: border-color 0.35s ease, box-shadow 0.35s ease, background 0.35s ease;
    }

    .toc.is-stuck {
      border-color: rgba(0, 229, 255, 0.35);
      background: rgba(10, 20, 36, 0.96);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.5), 0 0 28px rgba(0, 229, 255, 0.1);
    }

    .toc-title {
      font-family: "Orbitron", sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      color: var(--cyan);
      margin-bottom: 12px;
      padding: 0 6px;
      flex: 0 0 auto;
    }

    .toc-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: visible;
      padding-right: 0;
    }

    .toc-list a {
      display: block;
      padding: 8px 10px;
      border-radius: 10px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      border: 1px solid transparent;
      transition: color 0.28s ease, background 0.28s ease, border-color 0.28s ease;
    }

    .toc-list a:hover {
      color: var(--text);
      background: rgba(0, 229, 255, 0.06);
      border-color: rgba(0, 229, 255, 0.15);
    }

    .main-col {
      min-width: 0;
    }

    /* —— Header —— */
    header.hero {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: end;
      margin-bottom: 40px;
      animation: rise 0.8s ease both;
    }

    .brand-block {
      position: relative;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 14px;
    }

    .eyebrow::before {
      content: "";
      width: 28px;
      height: 2px;
      background: linear-gradient(90deg, var(--cyan), transparent);
      box-shadow: 0 0 12px var(--cyan);
    }

    .brand {
      font-family: "Orbitron", sans-serif;
      font-weight: 800;
      font-size: clamp(2.4rem, 5vw, 3.8rem);
      line-height: 1.05;
      letter-spacing: 0.04em;
      background: linear-gradient(120deg, #fff 20%, var(--cyan) 55%, var(--amber) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 24px rgba(0, 229, 255, 0.25));
    }

    .tagline {
      margin-top: 14px;
      max-width: 520px;
      font-size: 1.15rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .hud {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      color: var(--muted);
    }

    .hud-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(12px);
      border-radius: 999px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 10px var(--mint);
      animation: pulse 1.8s ease-in-out infinite;
    }

    .dot.off { background: var(--danger); box-shadow: 0 0 10px var(--danger); animation: none; }

    /* —— Toolbar —— */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      animation: rise 0.9s 0.08s ease both;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-btn {
      appearance: none;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      font-family: "Rajdhani", sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      transition: 0.25s ease;
    }

    .filter-btn:hover { color: var(--text); border-color: var(--line-strong); }
    .filter-btn.active {
      color: var(--bg0);
      background: linear-gradient(120deg, var(--cyan), #4df0ff);
      border-color: transparent;
      box-shadow: 0 0 24px rgba(0, 229, 255, 0.35);
    }

    .search {
      position: relative;
      min-width: min(280px, 100%);
    }

    .search input {
      width: 100%;
      padding: 10px 16px 10px 40px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      font-family: "Rajdhani", sans-serif;
      font-size: 1rem;
      font-weight: 500;
      outline: none;
      transition: 0.25s;
    }

    .search input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.12);
    }

    .search svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.55;
    }

    /* —— Grid —— */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 22px;
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: linear-gradient(160deg, rgba(16, 28, 48, 0.9), rgba(8, 14, 24, 0.95));
      box-shadow: var(--shadow);
      overflow: hidden;
      isolation: isolate;
      transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.35s, box-shadow 0.35s;
      animation: rise 0.7s ease both;
      --i: 0;
      animation-delay: calc(0.1s + var(--i) * 0.06s);
      scroll-margin-top: 24px;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, rgba(0, 229, 255, 0.55), transparent 40%, rgba(255, 176, 32, 0.35));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.35s;
      pointer-events: none;
      z-index: 2;
    }

    .card:hover {
      transform: translateY(-8px);
      border-color: var(--line-strong);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.55), 0 0 40px rgba(0, 229, 255, 0.12);
    }

    .card:hover::before { opacity: 1; }

    .card.flash {
      animation: cardFlash 0.85s ease-in-out 3;
      border-color: #ffb020;
      background: linear-gradient(160deg, rgba(60, 40, 8, 0.95), rgba(20, 14, 6, 0.98));
      box-shadow: 0 0 0 2px rgba(255, 176, 32, 0.9), 0 0 28px rgba(255, 176, 32, 0.55), 0 20px 50px rgba(0, 0, 0, 0.55);
    }

    .card.flash::before {
      opacity: 1;
      background: linear-gradient(135deg, rgba(255, 176, 32, 0.95), transparent 40%, rgba(255, 80, 40, 0.7));
    }

    @keyframes cardFlash {
      0%, 100% {
        border-color: #ffb020;
        box-shadow: 0 0 0 2px rgba(255, 176, 32, 0.7), 0 0 18px rgba(255, 176, 32, 0.35), 0 16px 40px rgba(0, 0, 0, 0.45);
        filter: brightness(1.05);
      }
      50% {
        border-color: #ffd56a;
        box-shadow: 0 0 0 3px #ffb020, 0 0 56px rgba(255, 176, 32, 0.85), 0 0 90px rgba(255, 120, 0, 0.45);
        filter: brightness(1.22);
      }
    }

    .card-media {
      position: relative;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      background: #05080f;
      cursor: zoom-in;
    }

    .card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.4s;
      filter: saturate(1.05) contrast(1.05);
      pointer-events: none;
    }

    .card:hover .card-media img {
      transform: scale(1.06);
      filter: saturate(1.15) contrast(1.08);
    }

    .card-media .shine {
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, transparent 30%, rgba(0, 229, 255, 0.12) 48%, transparent 62%);
      transform: translateX(-120%);
      transition: transform 0.7s ease;
      pointer-events: none;
    }

    .card:hover .shine { transform: translateX(120%); }

    .badge-row {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      z-index: 1;
    }

    .badge {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      padding: 5px 10px;
      border-radius: 999px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(6, 10, 18, 0.65);
      color: var(--text);
    }

    .badge.web { color: var(--cyan); border-color: rgba(0, 229, 255, 0.35); }
    .badge.electron { color: var(--amber); border-color: rgba(255, 176, 32, 0.4); }
    .badge.docs { color: var(--mint); border-color: rgba(61, 255, 154, 0.35); }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(6, 10, 18, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--muted);
    }

    .status-pill.on {
      color: var(--mint);
      border-color: rgba(61, 255, 154, 0.4);
    }

    .status-pill .sdot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
    }

    .card-body {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 18px 18px 16px;
      flex: 1;
    }

    .card-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .card-title {
      font-family: "Orbitron", sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      min-width: 0;
      flex: 1;
    }

    .tip-btn {
      flex: 0 0 auto;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid rgba(255, 176, 32, 0.45);
      background: rgba(255, 176, 32, 0.12);
      color: var(--amber);
      font-family: "Orbitron", sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }

    .tip-btn:hover,
    .tip-btn[aria-expanded="true"] {
      background: rgba(255, 176, 32, 0.28);
      border-color: var(--amber);
      box-shadow: 0 0 16px rgba(255, 176, 32, 0.35);
      transform: scale(1.06);
    }

    .card-desc {
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.45;
      font-weight: 500;
      flex: 1;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--cyan-dim);
      border: 1px solid rgba(0, 229, 255, 0.18);
      background: rgba(0, 229, 255, 0.06);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .btn {
      appearance: none;
      border: none;
      cursor: pointer;
      font-family: "Rajdhani", sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-radius: 10px;
      padding: 10px 14px;
      transition: 0.25s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex: 1;
      white-space: nowrap;
    }

    .btn-primary {
      color: #041018;
      background: linear-gradient(120deg, var(--cyan), #7af0ff);
      box-shadow: 0 0 0 0 rgba(0, 229, 255, 0.4);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 28px rgba(0, 229, 255, 0.35);
    }

    .btn-primary:disabled,
    .btn-primary.loading {
      opacity: 0.7;
      cursor: wait;
      transform: none;
    }

    .btn-ghost {
      flex: 0 0 auto;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--line);
      padding-inline: 12px;
    }

    .btn-ghost:hover {
      border-color: var(--line-strong);
      color: var(--cyan);
    }

    .btn-danger {
      flex: 0 0 auto;
      color: var(--danger);
      background: rgba(255, 92, 122, 0.08);
      border: 1px solid rgba(255, 92, 122, 0.3);
      padding-inline: 12px;
      display: none;
    }

    .card.is-running .btn-danger { display: inline-flex; }

    .toast-host {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .toast {
      pointer-events: auto;
      min-width: 260px;
      max-width: 360px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(10, 18, 30, 0.92);
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
      font-size: 0.95rem;
      animation: toastIn 0.35s ease both;
    }

    .toast.ok { border-color: rgba(61, 255, 154, 0.35); }
    .toast.err { border-color: rgba(255, 92, 122, 0.45); }

    footer {
      margin-top: 48px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      animation: rise 1s 0.2s ease both;
    }

    footer a {
      color: var(--cyan);
      text-decoration: none;
    }

    .hint-banner {
      margin-bottom: 22px;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px dashed rgba(255, 176, 32, 0.35);
      background: rgba(255, 176, 32, 0.06);
      color: #ffd58a;
      font-size: 0.95rem;
      display: none;
      animation: rise 0.6s ease both;
    }

    .hint-banner.show { display: block; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(0.85); }
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(4, 16, 24, 0.25);
      border-top-color: #041018;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @media (max-width: 1400px) {
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 1100px) {
      .layout { grid-template-columns: 1fr; }
      .toc {
        position: sticky;
        top: 72px;
        z-index: 50;
        transform: none !important;
      }
      .toc-list {
        flex-direction: row;
        flex-wrap: wrap;
        overflow: visible;
        gap: 6px;
      }
      .toc-list a {
        padding: 6px 10px;
        font-size: 0.85rem;
      }
    }

    @media (max-width: 1000px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 720px) {
      header.hero { grid-template-columns: 1fr; }
      .hud { align-items: flex-start; }
      .grid { grid-template-columns: 1fr; }
      .wrap { width: calc(100% - 24px); padding-top: 24px; }
    }

    /* —— Lightbox —— */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 20000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background: rgba(2, 6, 14, 0.82);
      backdrop-filter: blur(10px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s;
      cursor: zoom-out;
    }

    .lightbox.open {
      opacity: 1;
      visibility: visible;
    }

    .lightbox-panel {
      position: relative;
      max-width: min(1280px, 96vw);
      max-height: 92vh;
      cursor: default;
      transform: scale(0.96) translateY(8px);
      transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .lightbox.open .lightbox-panel {
      transform: scale(1) translateY(0);
    }

    .lightbox-panel img {
      display: block;
      max-width: 100%;
      max-height: calc(92vh - 48px);
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 12px;
      border: 1px solid var(--line-strong);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.65), 0 0 40px rgba(0, 229, 255, 0.12);
      background: #0a1018;
    }

    .lightbox-caption {
      margin-top: 12px;
      text-align: center;
      font-family: "Orbitron", sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .lightbox-close {
      position: absolute;
      top: -14px;
      right: -14px;
      width: 36px;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(10, 18, 30, 0.92);
      color: var(--text);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }

    .lightbox-close:hover {
      color: var(--cyan);
      border-color: var(--line-strong);
      box-shadow: 0 0 16px rgba(0, 229, 255, 0.25);
    }

    /* —— Start tip popover —— */
    .tip-popover {
      position: fixed;
      z-index: 21000;
      width: min(360px, calc(100vw - 24px));
      padding: 14px 16px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255, 176, 32, 0.4);
      background: rgba(10, 16, 28, 0.96);
      backdrop-filter: blur(14px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55), 0 0 24px rgba(255, 176, 32, 0.15);
      opacity: 0;
      visibility: hidden;
      transform: translateY(6px);
      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
    }

    .tip-popover.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .tip-popover-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .tip-popover-head strong {
      font-family: "Rajdhani", sans-serif;
      font-size: 0.95rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--amber);
    }

    .tip-popover-close {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      padding: 2px 6px;
    }

    .tip-popover-close:hover { color: var(--text); }

    .tip-popover-body {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.8rem;
      line-height: 1.6;
      color: #9edff0;
      word-break: break-word;
    }

    .tip-popover-name {
      margin-bottom: 8px;
      font-family: "Orbitron", sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      color: var(--text);
    }
  </style>
</head>
<body>
  <div id="grid"></div>
  <canvas id="particles"></canvas>
  <div class="scanline"></div>

  <div class="wrap">
    <div class="layout">
      <aside class="toc" aria-label="项目目录">
        <div class="toc-title">目录</div>
        <ul class="toc-list" id="tocList"></ul>
      </aside>

      <div class="main-col">
        <header class="hero">
          <div class="brand-block">
            <div class="eyebrow">LOCAL TOOLKIT // 0xDEV</div>
            <h1 class="brand">工具门户</h1>
            <p class="tagline">本地开发工具集合 · 预览说明与启动方式</p>
          </div>
          <div class="hud">
            <div class="hud-chip" id="clockChip">--:--:--</div>
            <div class="hud-chip"><span id="countChip">-- PROJECTS</span></div>
          </div>
        </header>

        <div class="toolbar">
          <div class="filters" id="filters">
            <button class="filter-btn active" data-filter="all">全部</button>
            <button class="filter-btn" data-filter="web">Web</button>
            <button class="filter-btn" data-filter="electron">桌面</button>
            <button class="filter-btn" data-filter="docs">文档</button>
          </div>
          <div class="search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8aa0b8" stroke-width="2">
              <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
            </svg>
            <input id="searchInput" type="search" placeholder="搜索工具…" autocomplete="off" />
          </div>
        </div>

        <div class="grid" id="projectGrid"></div>

        <footer>
          <span>DEV ARSENAL · PORTAL v1.0</span>
          <span>点击截图放大 · 名称旁 ? 查看启动方式</span>
        </footer>
      </div>
    </div>
  </div>

  <div class="lightbox" id="lightbox" hidden>
    <div class="lightbox-panel" role="dialog" aria-modal="true" aria-label="图片预览">
      <button type="button" class="lightbox-close" id="lightboxClose" aria-label="关闭">×</button>
      <img id="lightboxImg" alt="" />
      <div class="lightbox-caption" id="lightboxCaption"></div>
    </div>
  </div>

  <div class="tip-popover" id="tipPopover" role="dialog" aria-label="如何启动" hidden>
    <div class="tip-popover-head">
      <strong>如何启动</strong>
      <button type="button" class="tip-popover-close" id="tipPopoverClose" aria-label="关闭">×</button>
    </div>
    <div class="tip-popover-name" id="tipPopoverName"></div>
    <div class="tip-popover-body" id="tipPopoverBody"></div>
  </div>

  <script>
    const PROJECTS = [
      {
        id: 'hdr',
        name: 'HDR 预览器',
        image: 'hdr预览器/界面.png',
        category: 'web',
        tags: ['Three.js', 'HDRI', '材质'],
        desc: '用途：挑选 Poly Haven HDRI，在真实环境光照下预览并调 GLB 材质，再导出轻量模型。',
        start: '双击 启动.bat（打开 http://127.0.0.1:5101 ）',
      },
      {
        id: 'linux',
        name: 'Linux 可视化',
        image: 'linux可视化/界面.png',
        category: 'web',
        tags: ['SSH', 'Docker', '运维'],
        desc: '用途：浏览器里 SSH 管远程 Linux，可视化 Docker / 部署 / 数据库，少敲命令。',
        start: '双击 启动.bat（打开 http://127.0.0.1:5173 ）',
      },
      {
        id: 'linux-client',
        name: 'Linux 客户端',
        image: 'linux客户端/linux客户端.png',
        category: 'electron',
        tags: ['Java', 'Swing', 'SSH'],
        desc: '用途：Windows 桌面端服务器管理，监控、文件、容器与一键部署，独立窗口使用。',
        start: '双击 启动.bat（需已安装 Java，打开桌面窗口）',
      },
      {
        id: 'quickshare',
        name: 'QuickShare 快传',
        image: 'QuickShare/界面.png',
        category: 'electron',
        tags: ['局域网', '传文件', 'Python'],
        desc: '用途：同一 WiFi 内互传文档、安装包、视频，自动发现设备，免 U 盘、免网盘。',
        start: '双击 启动.bat（打开桌面窗口，有 exe 则直接运行）',
      },
      {
        id: 'nginx',
        name: 'Nginx 可视化',
        image: 'nginx_view/界面.png',
        category: 'electron',
        tags: ['Nginx', 'Electron', '本地站点'],
        desc: '用途：本机把多个前端 dist 挂到 Nginx，自动端口与 SPA 配置，方便本地/局域网预览。',
        start: '双击 启动.bat（打开 Electron 窗口）',
      },
      {
        id: 'nvm',
        name: 'NVM 可视化',
        image: 'nvm可视化/界面.png',
        category: 'electron',
        tags: ['Node', 'NVM', '版本管理'],
        desc: '用途：图形化管理 Windows Node 多版本，安装 / 切换 / 卸载，少敲 nvm 命令。',
        start: '双击 启动.bat（打开 Electron 窗口）',
      },
      {
        id: 'glb-shrink',
        name: 'GLB Shrink',
        image: 'glb-shrink/界面.png',
        category: 'web',
        tags: ['GLB', '压缩', 'Three.js'],
        desc: '用途：拖放压缩臃肿 GLB（Draco + WebP），左右对比预览后下载，适合网页/游戏上线。',
        start: '双击 启动.bat（打开 http://127.0.0.1:5201 ）',
      },
      {
        id: 'gltf-transform',
        name: 'glTF Transform',
        image: 'gltf-transform/界面.png',
        category: 'web',
        tags: ['glTF', '转换', '工具'],
        desc: '用途：本地 glTF/GLB 处理与转换相关工具入口（按版本目录使用）。',
        start: '双击 启动.bat（打开 http://127.0.0.1:3000 ）',
      },
      {
        id: 'sketchfab',
        name: 'Sketchfab 模型库',
        image: 'sketchfab/界面.png',
        category: 'web',
        tags: ['Sketchfab', '模型', '搜索'],
        desc: '用途：搜索、预览 Sketchfab 模型，筛选可下载资源，方便找 3D 素材。',
        start: '双击 启动.bat（打开 http://127.0.0.1:8090 ）',
      },
      {
        id: 'three',
        name: 'Three.js 中文文档',
        image: 'three.js_185_CN/界面.png',
        category: 'docs',
        tags: ['Three.js', 'r185', 'API'],
        desc: '用途：查阅 Three.js r185 简体中文 API，边查边写 3D 代码。',
        start: '双击 启动.bat（打开 http://127.0.0.1:8081/docs/ ）',
      },
      {
        id: 'uieditor',
        name: 'UI 编辑器',
        image: 'UI编辑器/界面.png',
        category: 'web',
        tags: ['React', 'Figma', '导出'],
        desc: '用途：拖拽搭界面原型，支持 Figma 导入，导出 HTML / React / Vue 代码。',
        start: '双击 启动.bat（打开 http://127.0.0.1:5202 ）',
      },
    ];

    const grid = document.getElementById('projectGrid');
    const tocList = document.getElementById('tocList');
    const filters = document.getElementById('filters');
    const searchInput = document.getElementById('searchInput');
    const tipPopover = document.getElementById('tipPopover');
    const tipPopoverName = document.getElementById('tipPopoverName');
    const tipPopoverBody = document.getElementById('tipPopoverBody');
    let activeFilter = 'all';
    let renderedOnce = false;
    let activeTipBtn = null;

    function catLabel(cat) {
      if (cat === 'electron') return { text: 'DESKTOP', cls: 'electron' };
      if (cat === 'docs') return { text: 'DOCS', cls: 'docs' };
      return { text: 'WEB', cls: 'web' };
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function closeTip() {
      tipPopover.classList.remove('open');
      tipPopover.hidden = true;
      if (activeTipBtn) {
        activeTipBtn.setAttribute('aria-expanded', 'false');
        activeTipBtn = null;
      }
    }

    function openTip(btn, project) {
      if (activeTipBtn === btn && tipPopover.classList.contains('open')) {
        closeTip();
        return;
      }
      tipPopoverName.textContent = project.name;
      tipPopoverBody.textContent = project.start;
      tipPopover.hidden = false;

      const rect = btn.getBoundingClientRect();
      const width = Math.min(360, window.innerWidth - 24);
      let left = rect.left;
      let top = rect.bottom + 10;
      if (left + width > window.innerWidth - 12) left = window.innerWidth - width - 12;
      if (left < 12) left = 12;
      if (top + 160 > window.innerHeight) top = Math.max(12, rect.top - 160);

      tipPopover.style.width = width + 'px';
      tipPopover.style.left = left + 'px';
      tipPopover.style.top = top + 'px';

      if (activeTipBtn) activeTipBtn.setAttribute('aria-expanded', 'false');
      activeTipBtn = btn;
      btn.setAttribute('aria-expanded', 'true');
      requestAnimationFrame(() => tipPopover.classList.add('open'));
    }

    function renderToc(list) {
      tocList.innerHTML = list
        .map(
          (p) =>
            `<li><a href="#project-${p.id}" data-id="${p.id}">${escapeHtml(p.name)}</a></li>`
        )
        .join('');
    }

    function render() {
      const q = searchInput.value.trim().toLowerCase();
      const list = PROJECTS.filter((p) => {
        const byCat = activeFilter === 'all' || p.category === activeFilter;
        const byQ =
          !q ||
          p.name.toLowerCase().includes(q) ||
          p.desc.toLowerCase().includes(q) ||
          (p.start && p.start.toLowerCase().includes(q)) ||
          p.tags.some((t) => t.toLowerCase().includes(q));
        return byCat && byQ;
      });

      const animate = !renderedOnce;
      renderedOnce = true;
      closeTip();
      renderToc(list);

      grid.innerHTML = list
        .map((p, i) => {
          const cat = catLabel(p.category);
          return `
          <article class="card" style="${animate ? `--i:${i}` : 'animation:none'}" id="project-${p.id}" data-id="${p.id}">
            <div class="card-media" data-preview="${encodeURI(p.image)}" data-title="${escapeHtml(p.name)}" title="点击放大">
              <img src="${encodeURI(p.image)}" alt="${escapeHtml(p.name)}" loading="lazy" decoding="async" />
              <div class="shine"></div>
              <div class="badge-row">
                <span class="badge ${cat.cls}">${cat.text}</span>
              </div>
            </div>
            <div class="card-body">
              <div class="card-title-row">
                <h2 class="card-title">${escapeHtml(p.name)}</h2>
                <button type="button" class="tip-btn" data-tip-id="${p.id}" aria-label="如何启动" aria-expanded="false" title="如何启动">?</button>
              </div>
              <p class="card-desc">${escapeHtml(p.desc)}</p>
              <div class="tags">${p.tags.map((t) => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>
            </div>
          </article>`;
        })
        .join('');
    }

    filters.addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      activeFilter = btn.dataset.filter;
      filters.querySelectorAll('.filter-btn').forEach((b) => b.classList.toggle('active', b === btn));
      render();
    });

    searchInput.addEventListener('input', render);

    let flashTimer = null;
    tocList.addEventListener('click', (e) => {
      const link = e.target.closest('a[data-id]');
      if (!link) return;
      e.preventDefault();
      const card = document.getElementById(`project-${link.dataset.id}`);
      if (!card) return;
      card.scrollIntoView({ behavior: 'smooth', block: 'start' });

      document.querySelectorAll('.card.flash').forEach((el) => {
        el.classList.remove('flash');
        el.style.animation = 'none';
      });
      if (flashTimer) clearTimeout(flashTimer);

      requestAnimationFrame(() => {
        card.style.animation = '';
        card.classList.add('flash');
        flashTimer = setTimeout(() => {
          card.classList.remove('flash');
          card.style.animation = 'none';
          flashTimer = null;
        }, 3000);
      });
    });

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxCaption = document.getElementById('lightboxCaption');

    function openLightbox(src, title) {
      lightboxImg.src = src;
      lightboxImg.alt = title || '';
      lightboxCaption.textContent = title || '';
      lightbox.hidden = false;
      requestAnimationFrame(() => lightbox.classList.add('open'));
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
      setTimeout(() => {
        if (!lightbox.classList.contains('open')) {
          lightbox.hidden = true;
          lightboxImg.removeAttribute('src');
        }
      }, 250);
    }

    grid.addEventListener('click', (e) => {
      const tipBtn = e.target.closest('.tip-btn');
      if (tipBtn) {
        e.stopPropagation();
        const project = PROJECTS.find((p) => p.id === tipBtn.dataset.tipId);
        if (project) openTip(tipBtn, project);
        return;
      }
      const media = e.target.closest('.card-media');
      if (!media) return;
      openLightbox(media.dataset.preview, media.dataset.title);
    });

    document.getElementById('tipPopoverClose').addEventListener('click', closeTip);
    document.addEventListener('click', (e) => {
      if (!tipPopover.classList.contains('open')) return;
      if (e.target.closest('.tip-popover') || e.target.closest('.tip-btn')) return;
      closeTip();
    });
    window.addEventListener('scroll', () => {
      if (tipPopover.classList.contains('open')) closeTip();
    }, { passive: true });

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox || e.target.id === 'lightboxClose') closeLightbox();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (tipPopover.classList.contains('open')) closeTip();
      else if (lightbox.classList.contains('open')) closeLightbox();
    });

    function tickClock() {
      document.getElementById('clockChip').textContent = new Date().toLocaleTimeString('zh-CN', {
        hour12: false,
      });
    }

    (function particles() {
      const canvas = document.getElementById('particles');
      const ctx = canvas.getContext('2d');
      let w, h, dots;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        dots = Array.from({ length: Math.min(70, Math.floor((w * h) / 28000)) }, () => ({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.35,
          vy: (Math.random() - 0.5) * 0.35,
          r: Math.random() * 1.6 + 0.4,
        }));
      }

      function frame() {
        ctx.clearRect(0, 0, w, h);
        for (const d of dots) {
          d.x += d.vx;
          d.y += d.vy;
          if (d.x < 0 || d.x > w) d.vx *= -1;
          if (d.y < 0 || d.y > h) d.vy *= -1;
          ctx.beginPath();
          ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(0, 229, 255, 0.45)';
          ctx.fill();
        }
        for (let i = 0; i < dots.length; i++) {
          for (let j = i + 1; j < dots.length; j++) {
            const a = dots[i];
            const b = dots[j];
            const dx = a.x - b.x;
            const dy = a.y - b.y;
            const dist = Math.hypot(dx, dy);
            if (dist < 120) {
              ctx.strokeStyle = `rgba(0, 229, 255, ${0.12 * (1 - dist / 120)})`;
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(b.x, b.y);
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(frame);
      }

      resize();
      window.addEventListener('resize', resize);
      frame();
    })();

    tickClock();
    setInterval(tickClock, 1000);
    document.getElementById('countChip').textContent = `${PROJECTS.length} PROJECTS`;

    (function tocMotion() {
      const toc = document.querySelector('.toc');
      if (!toc) return;
      let current = 0;
      let target = 0;
      let lastScroll = window.scrollY;
      let running = false;

      function canFloat() {
        return window.matchMedia('(min-width: 1101px)').matches;
      }

      function animate() {
        running = true;
        current += (target - current) * 0.16;
        target *= 0.88;
        if (Math.abs(target) < 0.08) target = 0;
        if (Math.abs(current) < 0.08 && target === 0) {
          current = 0;
          toc.style.transform = '';
          running = false;
          return;
        }
        toc.style.transform = `translate3d(0, ${current.toFixed(2)}px, 0)`;
        requestAnimationFrame(animate);
      }

      window.addEventListener(
        'scroll',
        () => {
          const y = window.scrollY;
          toc.classList.toggle('is-stuck', y > 80);
          if (!canFloat()) {
            toc.style.transform = '';
            return;
          }
          const dy = y - lastScroll;
          lastScroll = y;
          target = Math.max(-32, Math.min(32, target + dy * 0.42));
          if (!running) requestAnimationFrame(animate);
        },
        { passive: true }
      );
    })();

    render();
  </script>
</body>
</html>
