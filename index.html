<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工具门户 · Dev Arsenal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0: #06090f;
      --bg1: #0b1220;
      --panel: rgba(12, 22, 38, 0.72);
      --panel-solid: #0e1828;
      --line: rgba(0, 229, 255, 0.18);
      --line-strong: rgba(0, 229, 255, 0.45);
      --cyan: #00e5ff;
      --cyan-dim: #00b8d4;
      --amber: #ffb020;
      --mint: #3dff9a;
      --text: #e8f1ff;
      --muted: #8aa0b8;
      --danger: #ff5c7a;
      --radius: 18px;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--bg0);
      color: var(--text);
      font-family: "Rajdhani", system-ui, sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 50% at 15% -10%, rgba(0, 229, 255, 0.16), transparent 55%),
        radial-gradient(ellipse 60% 40% at 90% 10%, rgba(255, 176, 32, 0.1), transparent 50%),
        radial-gradient(ellipse 50% 50% at 50% 100%, rgba(61, 255, 154, 0.06), transparent 55%);
      z-index: 0;
    }

    #grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      opacity: 0.35;
      background-image:
        linear-gradient(rgba(0, 229, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 229, 255, 0.05) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(ellipse at center, black 20%, transparent 75%);
    }

    #particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .scanline {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.08) 2px,
        rgba(0, 0, 0, 0.08) 4px
      );
      opacity: 0.35;
      mix-blend-mode: multiply;
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: min(1680px, calc(100% - 48px));
      margin: 0 auto;
      padding: 36px 0 80px;
    }

    /* —— Header —— */
    header.hero {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: end;
      margin-bottom: 40px;
      animation: rise 0.8s ease both;
    }

    .brand-block {
      position: relative;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 14px;
    }

    .eyebrow::before {
      content: "";
      width: 28px;
      height: 2px;
      background: linear-gradient(90deg, var(--cyan), transparent);
      box-shadow: 0 0 12px var(--cyan);
    }

    .brand {
      font-family: "Orbitron", sans-serif;
      font-weight: 800;
      font-size: clamp(2.4rem, 5vw, 3.8rem);
      line-height: 1.05;
      letter-spacing: 0.04em;
      background: linear-gradient(120deg, #fff 20%, var(--cyan) 55%, var(--amber) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 24px rgba(0, 229, 255, 0.25));
    }

    .tagline {
      margin-top: 14px;
      max-width: 520px;
      font-size: 1.15rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .hud {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      color: var(--muted);
    }

    .hud-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(12px);
      border-radius: 999px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 10px var(--mint);
      animation: pulse 1.8s ease-in-out infinite;
    }

    .dot.off { background: var(--danger); box-shadow: 0 0 10px var(--danger); animation: none; }

    /* —— Toolbar —— */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      animation: rise 0.9s 0.08s ease both;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-btn {
      appearance: none;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      font-family: "Rajdhani", sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      transition: 0.25s ease;
    }

    .filter-btn:hover { color: var(--text); border-color: var(--line-strong); }
    .filter-btn.active {
      color: var(--bg0);
      background: linear-gradient(120deg, var(--cyan), #4df0ff);
      border-color: transparent;
      box-shadow: 0 0 24px rgba(0, 229, 255, 0.35);
    }

    .search {
      position: relative;
      min-width: min(280px, 100%);
    }

    .search input {
      width: 100%;
      padding: 10px 16px 10px 40px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      font-family: "Rajdhani", sans-serif;
      font-size: 1rem;
      font-weight: 500;
      outline: none;
      transition: 0.25s;
    }

    .search input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.12);
    }

    .search svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.55;
    }

    /* —— Grid —— */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: linear-gradient(160deg, rgba(16, 28, 48, 0.9), rgba(8, 14, 24, 0.95));
      box-shadow: var(--shadow);
      overflow: hidden;
      isolation: isolate;
      transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.35s, box-shadow 0.35s;
      animation: rise 0.7s ease both;
      --i: 0;
      animation-delay: calc(0.1s + var(--i) * 0.06s);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, rgba(0, 229, 255, 0.55), transparent 40%, rgba(255, 176, 32, 0.35));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.35s;
      pointer-events: none;
      z-index: 2;
    }

    .card:hover {
      transform: translateY(-8px);
      border-color: var(--line-strong);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.55), 0 0 40px rgba(0, 229, 255, 0.12);
    }

    .card:hover::before { opacity: 1; }

    .card-media {
      position: relative;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      background: #05080f;
      cursor: zoom-in;
    }

    .card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.4s;
      filter: saturate(1.05) contrast(1.05);
      pointer-events: none;
    }

    .card:hover .card-media img {
      transform: scale(1.06);
      filter: saturate(1.15) contrast(1.08);
    }

    .card-media .shine {
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, transparent 30%, rgba(0, 229, 255, 0.12) 48%, transparent 62%);
      transform: translateX(-120%);
      transition: transform 0.7s ease;
      pointer-events: none;
    }

    .card:hover .shine { transform: translateX(120%); }

    .badge-row {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      z-index: 1;
    }

    .badge {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      padding: 5px 10px;
      border-radius: 999px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(6, 10, 18, 0.65);
      color: var(--text);
    }

    .badge.web { color: var(--cyan); border-color: rgba(0, 229, 255, 0.35); }
    .badge.electron { color: var(--amber); border-color: rgba(255, 176, 32, 0.4); }
    .badge.docs { color: var(--mint); border-color: rgba(61, 255, 154, 0.35); }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(6, 10, 18, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--muted);
    }

    .status-pill.on {
      color: var(--mint);
      border-color: rgba(61, 255, 154, 0.4);
    }

    .status-pill .sdot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
    }

    .card-body {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 18px 18px 16px;
      flex: 1;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.06em;
    }

    .card-desc {
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.45;
      font-weight: 500;
      flex: 1;
    }

    .card-start {
      margin-top: 2px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px dashed rgba(0, 229, 255, 0.28);
      background: rgba(0, 229, 255, 0.05);
      font-family: "JetBrains Mono", monospace;
      font-size: 0.78rem;
      line-height: 1.55;
      color: #9edff0;
      letter-spacing: 0.01em;
    }

    .card-start strong {
      display: block;
      margin-bottom: 4px;
      font-family: "Rajdhani", sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--amber);
      text-transform: uppercase;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--cyan-dim);
      border: 1px solid rgba(0, 229, 255, 0.18);
      background: rgba(0, 229, 255, 0.06);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .btn {
      appearance: none;
      border: none;
      cursor: pointer;
      font-family: "Rajdhani", sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-radius: 10px;
      padding: 10px 14px;
      transition: 0.25s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex: 1;
      white-space: nowrap;
    }

    .btn-primary {
      color: #041018;
      background: linear-gradient(120deg, var(--cyan), #7af0ff);
      box-shadow: 0 0 0 0 rgba(0, 229, 255, 0.4);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 28px rgba(0, 229, 255, 0.35);
    }

    .btn-primary:disabled,
    .btn-primary.loading {
      opacity: 0.7;
      cursor: wait;
      transform: none;
    }

    .btn-ghost {
      flex: 0 0 auto;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--line);
      padding-inline: 12px;
    }

    .btn-ghost:hover {
      border-color: var(--line-strong);
      color: var(--cyan);
    }

    .btn-danger {
      flex: 0 0 auto;
      color: var(--danger);
      background: rgba(255, 92, 122, 0.08);
      border: 1px solid rgba(255, 92, 122, 0.3);
      padding-inline: 12px;
      display: none;
    }

    .card.is-running .btn-danger { display: inline-flex; }

    .toast-host {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .toast {
      pointer-events: auto;
      min-width: 260px;
      max-width: 360px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(10, 18, 30, 0.92);
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
      font-size: 0.95rem;
      animation: toastIn 0.35s ease both;
    }

    .toast.ok { border-color: rgba(61, 255, 154, 0.35); }
    .toast.err { border-color: rgba(255, 92, 122, 0.45); }

    footer {
      margin-top: 48px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      animation: rise 1s 0.2s ease both;
    }

    footer a {
      color: var(--cyan);
      text-decoration: none;
    }

    .hint-banner {
      margin-bottom: 22px;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px dashed rgba(255, 176, 32, 0.35);
      background: rgba(255, 176, 32, 0.06);
      color: #ffd58a;
      font-size: 0.95rem;
      display: none;
      animation: rise 0.6s ease both;
    }

    .hint-banner.show { display: block; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(0.85); }
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(4, 16, 24, 0.25);
      border-top-color: #041018;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @media (max-width: 1400px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 1000px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 720px) {
      header.hero { grid-template-columns: 1fr; }
      .hud { align-items: flex-start; }
      .grid { grid-template-columns: 1fr; }
      .wrap { width: calc(100% - 24px); padding-top: 24px; }
    }

    /* —— Lightbox —— */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 20000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background: rgba(2, 6, 14, 0.82);
      backdrop-filter: blur(10px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s;
      cursor: zoom-out;
    }

    .lightbox.open {
      opacity: 1;
      visibility: visible;
    }

    .lightbox-panel {
      position: relative;
      max-width: min(1280px, 96vw);
      max-height: 92vh;
      cursor: default;
      transform: scale(0.96) translateY(8px);
      transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .lightbox.open .lightbox-panel {
      transform: scale(1) translateY(0);
    }

    .lightbox-panel img {
      display: block;
      max-width: 100%;
      max-height: calc(92vh - 48px);
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 12px;
      border: 1px solid var(--line-strong);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.65), 0 0 40px rgba(0, 229, 255, 0.12);
      background: #0a1018;
    }

    .lightbox-caption {
      margin-top: 12px;
      text-align: center;
      font-family: "Orbitron", sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .lightbox-close {
      position: absolute;
      top: -14px;
      right: -14px;
      width: 36px;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(10, 18, 30, 0.92);
      color: var(--text);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }

    .lightbox-close:hover {
      color: var(--cyan);
      border-color: var(--line-strong);
      box-shadow: 0 0 16px rgba(0, 229, 255, 0.25);
    }
  </style>
</head>
<body>
  <div id="grid"></div>
  <canvas id="particles"></canvas>
  <div class="scanline"></div>

  <div class="wrap">
    <header class="hero">
      <div class="brand-block">
        <div class="eyebrow">LOCAL TOOLKIT // 0xDEV</div>
        <h1 class="brand">工具门户</h1>
        <p class="tagline">本地开发工具集合 · 预览说明与启动方式</p>
      </div>
      <div class="hud">
        <div class="hud-chip" id="clockChip">--:--:--</div>
        <div class="hud-chip"><span id="countChip">-- PROJECTS</span></div>
      </div>
    </header>

    <div class="toolbar">
      <div class="filters" id="filters">
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="web">Web</button>
        <button class="filter-btn" data-filter="electron">桌面</button>
        <button class="filter-btn" data-filter="docs">文档</button>
      </div>
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8aa0b8" stroke-width="2">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
        </svg>
        <input id="searchInput" type="search" placeholder="搜索工具…" autocomplete="off" />
      </div>
    </div>

    <div class="grid" id="projectGrid"></div>

    <footer>
      <span>DEV ARSENAL · PORTAL v1.0</span>
      <span>点击截图放大 · 卡片内含启动提示</span>
    </footer>
  </div>

  <div class="lightbox" id="lightbox" hidden>
    <div class="lightbox-panel" role="dialog" aria-modal="true" aria-label="图片预览">
      <button type="button" class="lightbox-close" id="lightboxClose" aria-label="关闭">×</button>
      <img id="lightboxImg" alt="" />
      <div class="lightbox-caption" id="lightboxCaption"></div>
    </div>
  </div>

  <script>
    const PROJECTS = [
      {
        id: 'hdr',
        name: 'HDR 预览器',
        image: 'hdr预览器/界面.png',
        category: 'web',
        tags: ['Three.js', 'HDRI', '材质'],
        desc: '用途：挑选 Poly Haven HDRI，在真实环境光照下预览并调 GLB 材质，再导出轻量模型。',
        start: 'cd hdr预览器 → npm install → npm run dev',
      },
      {
        id: 'linux',
        name: 'Linux 可视化',
        image: 'linux可视化/界面.png',
        category: 'web',
        tags: ['SSH', 'Docker', '运维'],
        desc: '用途：浏览器里 SSH 管远程 Linux，可视化 Docker / 部署 / 数据库，少敲命令。',
        start: '双击 start.bat，或 npm install → npm run dev',
      },
      {
        id: 'linux-client',
        name: 'Linux 客户端',
        image: 'linux客户端/linux客户端.png',
        category: 'electron',
        tags: ['Java', 'Swing', 'SSH'],
        desc: '用途：Windows 桌面端服务器管理，监控、文件、容器与一键部署，独立窗口使用。',
        start: '双击 run.bat，或 java -jar target\\easy-ssh-1.0.0.jar',
      },
      {
        id: 'nginx',
        name: 'Nginx 可视化',
        image: 'nginx_view/界面.png',
        category: 'electron',
        tags: ['Nginx', 'Electron', '本地站点'],
        desc: '用途：本机把多个前端 dist 挂到 Nginx，自动端口与 SPA 配置，方便本地/局域网预览。',
        start: 'cd nginx_view → npm install → npm run dev',
      },
      {
        id: 'nvm',
        name: 'NVM 可视化',
        image: 'nvm可视化/界面.png',
        category: 'electron',
        tags: ['Node', 'NVM', '版本管理'],
        desc: '用途：图形化管理 Windows Node 多版本，安装 / 切换 / 卸载，少敲 nvm 命令。',
        start: '双击 启动.bat，或 npm install → npm start',
      },
      {
        id: 'glb-shrink',
        name: 'GLB Shrink',
        image: 'glb-shrink/界面.png',
        category: 'web',
        tags: ['GLB', '压缩', 'Three.js'],
        desc: '用途：拖放压缩臃肿 GLB（Draco + WebP），左右对比预览后下载，适合网页/游戏上线。',
        start: 'cd glb-shrink → npm install → npm run dev',
      },
      {
        id: 'gltf-transform',
        name: 'glTF Transform',
        image: 'gltf-transform/界面.png',
        category: 'web',
        tags: ['glTF', '转换', '工具'],
        desc: '用途：本地 glTF/GLB 处理与转换相关工具入口（按版本目录使用）。',
        start: 'cd gltf-transform/3.0/frontend → npm install → node server.js',
      },
      {
        id: 'three',
        name: 'Three.js 中文文档',
        image: 'three.js_185_CN/界面.png',
        category: 'docs',
        tags: ['Three.js', 'r185', 'API'],
        desc: '用途：查阅 Three.js r185 简体中文 API，边查边写 3D 代码。',
        start: 'cd three.js_185_CN → npm install → npm run dev',
      },
      {
        id: 'uieditor',
        name: 'UI 编辑器',
        image: 'UI编辑器/界面.png',
        category: 'web',
        tags: ['React', 'Figma', '导出'],
        desc: '用途：拖拽搭界面原型，支持 Figma 导入，导出 HTML / React / Vue 代码。',
        start: '根目录 npm install 后，再装 apps/web 与 server，最后 npm run dev',
      },
    ];

    const grid = document.getElementById('projectGrid');
    const filters = document.getElementById('filters');
    const searchInput = document.getElementById('searchInput');
    let activeFilter = 'all';
    let renderedOnce = false;

    function catLabel(cat) {
      if (cat === 'electron') return { text: 'DESKTOP', cls: 'electron' };
      if (cat === 'docs') return { text: 'DOCS', cls: 'docs' };
      return { text: 'WEB', cls: 'web' };
    }

    function render() {
      const q = searchInput.value.trim().toLowerCase();
      const list = PROJECTS.filter((p) => {
        const byCat = activeFilter === 'all' || p.category === activeFilter;
        const byQ =
          !q ||
          p.name.toLowerCase().includes(q) ||
          p.desc.toLowerCase().includes(q) ||
          (p.start && p.start.toLowerCase().includes(q)) ||
          p.tags.some((t) => t.toLowerCase().includes(q));
        return byCat && byQ;
      });

      const animate = !renderedOnce;
      renderedOnce = true;

      grid.innerHTML = list
        .map((p, i) => {
          const cat = catLabel(p.category);
          return `
          <article class="card" style="${animate ? `--i:${i}` : 'animation:none'}" data-id="${p.id}">
            <div class="card-media" data-preview="${encodeURI(p.image)}" data-title="${p.name}" title="点击放大">
              <img src="${encodeURI(p.image)}" alt="${p.name}" loading="lazy" decoding="async" />
              <div class="shine"></div>
              <div class="badge-row">
                <span class="badge ${cat.cls}">${cat.text}</span>
              </div>
            </div>
            <div class="card-body">
              <h2 class="card-title">${p.name}</h2>
              <p class="card-desc">${p.desc}</p>
              <div class="card-start"><strong>如何启动</strong>${p.start}</div>
              <div class="tags">${p.tags.map((t) => `<span class="tag">${t}</span>`).join('')}</div>
            </div>
          </article>`;
        })
        .join('');
    }

    filters.addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      activeFilter = btn.dataset.filter;
      filters.querySelectorAll('.filter-btn').forEach((b) => b.classList.toggle('active', b === btn));
      render();
    });

    searchInput.addEventListener('input', render);

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxCaption = document.getElementById('lightboxCaption');

    function openLightbox(src, title) {
      lightboxImg.src = src;
      lightboxImg.alt = title || '';
      lightboxCaption.textContent = title || '';
      lightbox.hidden = false;
      requestAnimationFrame(() => lightbox.classList.add('open'));
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
      setTimeout(() => {
        if (!lightbox.classList.contains('open')) {
          lightbox.hidden = true;
          lightboxImg.removeAttribute('src');
        }
      }, 250);
    }

    grid.addEventListener('click', (e) => {
      const media = e.target.closest('.card-media');
      if (!media) return;
      openLightbox(media.dataset.preview, media.dataset.title);
    });

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox || e.target.id === 'lightboxClose') closeLightbox();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox();
    });

    function tickClock() {
      document.getElementById('clockChip').textContent = new Date().toLocaleTimeString('zh-CN', {
        hour12: false,
      });
    }

    (function particles() {
      const canvas = document.getElementById('particles');
      const ctx = canvas.getContext('2d');
      let w, h, dots;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        dots = Array.from({ length: Math.min(70, Math.floor((w * h) / 28000)) }, () => ({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.35,
          vy: (Math.random() - 0.5) * 0.35,
          r: Math.random() * 1.6 + 0.4,
        }));
      }

      function frame() {
        ctx.clearRect(0, 0, w, h);
        for (const d of dots) {
          d.x += d.vx;
          d.y += d.vy;
          if (d.x < 0 || d.x > w) d.vx *= -1;
          if (d.y < 0 || d.y > h) d.vy *= -1;
          ctx.beginPath();
          ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(0, 229, 255, 0.45)';
          ctx.fill();
        }
        for (let i = 0; i < dots.length; i++) {
          for (let j = i + 1; j < dots.length; j++) {
            const a = dots[i];
            const b = dots[j];
            const dx = a.x - b.x;
            const dy = a.y - b.y;
            const dist = Math.hypot(dx, dy);
            if (dist < 120) {
              ctx.strokeStyle = `rgba(0, 229, 255, ${0.12 * (1 - dist / 120)})`;
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(b.x, b.y);
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(frame);
      }

      resize();
      window.addEventListener('resize', resize);
      frame();
    })();

    tickClock();
    setInterval(tickClock, 1000);
    document.getElementById('countChip').textContent = `${PROJECTS.length} PROJECTS`;
    render();
  </script>
</body>
